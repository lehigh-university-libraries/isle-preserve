services:
  lehigh_islandora.commands:
    class: Drupal\lehigh_islandora\Commands\PublishSubmission
    arguments:
      - '@file_system'
      - '@entity_type.manager'
    tags:
      - { name: drush.command }
  lehigh_islandora.source_browser.import_commands:
    class: Drupal\lehigh_islandora\Commands\SourceBrowserImport
    arguments: ['@lehigh_islandora.source_browser.importer', '@entity_type.manager']
    tags:
      - { name: drush.command }
