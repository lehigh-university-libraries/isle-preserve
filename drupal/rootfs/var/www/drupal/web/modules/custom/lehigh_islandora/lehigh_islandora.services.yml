services:
  lehigh_islandora.cache_book_manifests:
    class: Drupal\lehigh_islandora\EventSubscriber\CacheBookManifests
    arguments: ["@config.factory"]
    tags:
      - { name: event_subscriber }
  lehigh_islandora.cache_node_canonical:
    class: Drupal\lehigh_islandora\EventSubscriber\CacheNodeCanonical
    arguments: ["@config.factory"]
    tags:
      - { name: event_subscriber }
  lehigh_islandora.redirect_collections:
    class: Drupal\lehigh_islandora\EventSubscriber\RedirectCollections
    arguments: ['@router.route_provider']
    tags:
      - { name: event_subscriber }
  lehigh_islandora.journal_browser.repository:
    class: Drupal\lehigh_islandora\JournalBrowser\JournalBrowserRepository
    arguments: ['@entity_type.manager', '@database', '@lehigh_islandora.source_browser.access', '@lehigh_islandora.download_resolver', '@config.factory']
  lehigh_islandora.journal_browser.builder:
    class: Drupal\lehigh_islandora\JournalBrowser\JournalBrowserBuilder
    arguments: ['@lehigh_islandora.journal_browser.repository', '@request_stack', '@lehigh_islandora.source_browser.access', '@lehigh_islandora.source_browser.target_resolver', '@config.factory']
  lehigh_islandora.uriports:
    class: Drupal\lehigh_islandora\EventSubscriber\Uriports
    arguments: ["@config.factory"]
    tags:
      - { name: event_subscriber }
  lehigh_islandora.pdf_canonical:
    class: Drupal\lehigh_islandora\EventSubscriber\PdfCanonicalLink
    arguments: ["@config.factory"]
    tags:
      - { name: event_subscriber }
  lehigh_islandora.redirect_terms:
    class: Drupal\lehigh_islandora\EventSubscriber\RabbitHoleTerms
    arguments: ["@config.factory"]
    tags:
      - { name: event_subscriber }
  lehigh_islandora.facet_query_string_subscriber:
    class: Drupal\lehigh_islandora\EventSubscriber\FacetQueryStringSubscriber
    tags:
      - { name: event_subscriber }
  lehigh_islandora.media_insert_subscriber:
    class: Drupal\lehigh_islandora\EventSubscriber\MediaInsertSubscriber
    tags:
      - { name: event_subscriber }
  cache_context.on-campus:
    class: Drupal\lehigh_islandora\Cache\OnCampusCacheContext
    arguments: ['@request_stack']
    tags:
      - { name: cache.context, provider: lehigh_islandora }
  lehigh_islandora.source_browser.access:
    class: Drupal\lehigh_islandora\JournalBrowser\BrowserAccess
  lehigh_islandora.download_resolver:
    class: Drupal\lehigh_islandora\JournalBrowser\DownloadResolver
    arguments: ['@entity_type.manager', '@lehigh_islandora.source_browser.access']
  lehigh_islandora.source_browser.target_resolver:
    class: Drupal\lehigh_islandora\JournalBrowser\BrowserTargetResolver
    arguments: ['@entity_type.manager', '@views.executable', '@lehigh_islandora.source_browser.access']
  lehigh_islandora.source_browser.importer:
    class: Drupal\lehigh_islandora\JournalBrowser\SourceBrowserImporter
    arguments: ['@entity_type.manager', '@lehigh_islandora.journal_browser.repository', '@database', '@file.repository', '@file_system', '@http_client']
