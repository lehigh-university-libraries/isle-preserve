x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  alpaca:
    environment:
      ALPACA_DERIVATIVE_FITS_URL: http://crayfits:8080
      ALPACA_DERIVATIVE_OCR_URL: http://hypercube:8080
      ALPACA_DERIVATIVE_HOMARUS_URL: http://homarus:8080
      ALPACA_DERIVATIVE_HOUDINI_URL: http://houdini:8080
      ALPACA_DERIVATIVE_LIBREOFFICE_URL: http://libreoffice:8080
      ALPACA_DERIVATIVE_WHISPER_URL: http://whisper:8080
      ALPACA_DERIVATIVE_OCRPDF_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_HTR_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_SCRIBE_URL: http://scribe:8080
  drupal-cron:
    profiles: [none]
  rollout:
    profiles: [none]
  drupal-lehigh:
    profiles: [none]
  traefik:
    ports:
      - 8080:8080
  drupal:
    build:
      context: ./drupal
      x-bake:
        cache-from:
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:local
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:main
        cache-to:
          - type=inline
        platforms:
          - linux/arm64
    environment:
      URI_SCHEME: http
      DRUPAL_ENABLE_HTTPS: "false"
    secrets:
      - source: UID
    volumes:
      - drupal-public-files:/var/www/drupal/web/sites/default/files:rw
      - ./tmp/drupal-private-files:/var/www/drupal/private:rw
      - fcrepo-data:/fcrepo:rw
      - ./tmp/drupal:/tmp:rw
      - ./tmp/nginx:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-cache:/var/cache/nginx:rw
      - ./drupal/rootfs/var/www/drupal:/var/www/drupal:z,rw,${CONSISTENCY}
  mariadb:
    ports:
      - 3306:3306
  memcached:
    command: memcached -m 256 -I 5m
  fits:
    logging: *logging
    image: islandora/fits:7.1.3@sha256:965a2c6559c907428ea6abd29a70dba5e2edc6be7854a5b47cac3e06f0f041be
    volumes:
      - ./tmp/fits:/tmp:rw
  crayfits:
    logging: *logging
    image: islandora/crayfits:7.1.3@sha256:397636e775bb9c07c60954c20810c4f8a7dc0a8b0ab115cafee71d4a6216a451
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/crayfits:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hls:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-hls:main@sha256:82179e5d80b1d661540e3bb9a14801de0a0b5a4203d6435ebd8e8e267cced01c
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  homarus:
    logging: *logging
    image: islandora/homarus:7.1.3@sha256:b2f16b62c0a66dff84e882cc873e2086f509ebaf42b19eecfc2c515f2a856d5c
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/homarus:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  houdini:
    logging: *logging
    image: islandora/houdini:7.1.3@sha256:d19ab4c8c926be4c6f9a695a444c7f65361fb8b55fd38314048b808a8ab64c56
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/houdini:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hypercube:
    logging: *logging
    image: islandora/hypercube:7.1.3@sha256:b43a6b1c182e4922fd8d8f01f9bb84769175090bf15cbbf02e8fbac591d1fd83
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/hypercube:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  ocrpdf:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-ocrpdf:main@sha256:2d62f9e88d7ca0a174be929583f73bc05cecd0c42b671800f8ce4f01345988bb
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
  scribe:
    logging: *logging
    image: lehighlts/scyllaridae-scribe:main@sha256:0fb867d7f925f0a79cbc285bd1bc558b7011460b09f9020c5317b1e4084a4d40
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      SCRIBE_API_URL: ${SCRIBE_API_URL}
      SCRIBE_API_TOKEN: ${SCRIBE_API_TOKEN}
      SCRIBE_WORKSPACE_ID: ${SCRIBE_WORKSPACE_ID}
      ISLANDORA_SCRIBE_CORRELATION_URL: https://${DOMAIN}/islandora-scribe/correlation
      ISLANDORA_SCRIBE_CORRELATION_SECRET: ${ISLANDORA_SCRIBE_CORRELATION_SECRET}
    volumes:
      - ./certs/rootCA.pem:/app/ca.pem:r
  libreoffice:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-libreoffice:main@sha256:58ae1d7f9f8b209af22ce4d4989f43355679dfde829aa1ba51b10d6515c0c934
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  coverpage:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-coverpage:main@sha256:6e4439a461c18349212bb1a78fb42a190097a75f92ad9cbefc041ab8cc69de75
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  mergepdf:
    logging: *logging
    image: islandora/mergepdf:7.1.3@sha256:c4622c706cc56ee1106ccbc5f53ba9b9d22e6b472140326a3cf67df1836ae092
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      MAX_THREADS: 3
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  drupal-static:
    volumes:
      - ./tmp/drupal-private-files/canonical/${DOMAIN}/0:/usr/share/nginx/drupal:ro
      - ./tmp/drupal-private-files/iiif/${DOMAIN}/294de3557d9d00b3d2d8a1e6aab028cf:/usr/share/nginx/iiif:ro
      - drupal-public-files:/var/www/drupal/web/sites/default/files:ro
      - ./tmp/drupal-static:/tmp:rw
      - ./tmp/nginx-static:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-static-cache:/var/cache/nginx:rw
      - ./tmp/drupal/web:/var/www/drupal/web:rw
  fcrepo:
    volumes:
      - fcrepo-data:/data:rw
      - ./tmp/fcrepo:/tmp:rw
  triplet:
    volumes:
      - drupal-public-files:/public:r
      - ./tmp/drupal-private-files:/private:r
      - fcrepo-data:/fcrepo:r
      - ./certs/rootCA.pem:/etc/ssl/certs/lehigh.pem:r
      - ./conf/triplet/config.yaml:/etc/triplet/config.yaml:r
      - ./tmp/triplet-cache:/var/lib/triplet/cache:rw
