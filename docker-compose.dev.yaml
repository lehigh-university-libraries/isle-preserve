x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  alpaca:
    environment:
      ALPACA_DERIVATIVE_FITS_URL: http://crayfits:8080
      ALPACA_DERIVATIVE_OCR_URL: http://hypercube:8080
      ALPACA_DERIVATIVE_HOMARUS_URL: http://homarus:8080
      ALPACA_DERIVATIVE_HOUDINI_URL: http://houdini:8080
      ALPACA_DERIVATIVE_LIBREOFFICE_URL: http://libreoffice:8080
      ALPACA_DERIVATIVE_WHISPER_URL: http://whisper:8080
      ALPACA_DERIVATIVE_OCRPDF_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_HTR_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_SCRIBE_URL: http://scribe:8080
  drupal-cron:
    profiles: [none]
  rollout:
    profiles: [none]
  drupal-lehigh:
    profiles: [none]
  traefik:
    ports:
      - 8080:8080
  drupal:
    build:
      context: ./drupal
      x-bake:
        cache-from:
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:local
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:main
        cache-to:
          - type=inline
        platforms:
          - linux/arm64
    environment:
      URI_SCHEME: http
      DRUPAL_ENABLE_HTTPS: "false"
    secrets:
      - source: UID
    volumes:
      - drupal-public-files:/var/www/drupal/web/sites/default/files:rw
      - ./tmp/drupal-private-files:/var/www/drupal/private:rw
      - fcrepo-data:/fcrepo:rw
      - ./tmp/drupal:/tmp:rw
      - ./tmp/nginx:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-cache:/var/cache/nginx:rw
      - ./drupal/rootfs/var/www/drupal:/var/www/drupal:z,rw,${CONSISTENCY}
  mariadb:
    ports:
      - 3306:3306
  memcached:
    command: memcached -m 256 -I 5m
  fits:
    logging: *logging
    image: islandora/fits:7.0.20@sha256:1937e1bc3df7e4093e3df17c74ff3d581747618bce3adbf7afa26b9694be8486
    volumes:
      - ./tmp/fits:/tmp:rw
  crayfits:
    logging: *logging
    image: islandora/crayfits:7.0.20@sha256:6af7c18bb9ed95aa793c78be64fd791c89287fc37508448c1a16dd4fd6bc2b6c
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/crayfits:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hls:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-hls:main@sha256:d6b2425f6dae12bb65bc2fefa778f1a68e6bc1d57cd31c25b9f0ef27cd254c48
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  homarus:
    logging: *logging
    image: islandora/homarus:7.0.20@sha256:86fa180596693611808b89fba4e3e62b7105174c4897e91467d7a01b4ffea089
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/homarus:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  houdini:
    logging: *logging
    image: islandora/houdini:7.0.20@sha256:1d0d21a40312046e111f2d620c8bb36686ecf2dd896546de78c10e024741e5a0
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/houdini:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hypercube:
    logging: *logging
    image: islandora/hypercube:7.0.20@sha256:5049044021fc072c44d6f8565bf7d6b9b116d1a21a97900773e9aa32fa2e47f1
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/hypercube:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  ocrpdf:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-ocrpdf:main@sha256:bf79aa57c5f0a4490a2f57a968490fb78daa286112a33cd1654b50b00a2cd7a3
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
  scribe:
    logging: *logging
    image: lehighlts/scyllaridae-scribe:main@sha256:0fb867d7f925f0a79cbc285bd1bc558b7011460b09f9020c5317b1e4084a4d40
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      SCRIBE_API_URL: ${SCRIBE_API_URL}
      SCRIBE_API_TOKEN: ${SCRIBE_API_TOKEN}
      SCRIBE_WORKSPACE_ID: ${SCRIBE_WORKSPACE_ID}
      ISLANDORA_SCRIBE_CORRELATION_URL: https://${DOMAIN}/islandora-scribe/correlation
      ISLANDORA_SCRIBE_CORRELATION_SECRET: ${ISLANDORA_SCRIBE_CORRELATION_SECRET}
    volumes:
      - ./certs/rootCA.pem:/app/ca.pem:r
  libreoffice:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-libreoffice:main@sha256:bce8dc34745573e3eaf1d6fef6722494a0053e3e589524bb51423c7965a0643a
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  coverpage:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-coverpage:main@sha256:c8a859998a7cb1065ec73c2eb3871e269106e00a2913d9adb5a33f9c55a60dde
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  mergepdf:
    logging: *logging
    image: islandora/mergepdf:7.0.20@sha256:940e4e11070ee4eed2e98e07c664a30a6ff5284ac7638d236e207b6ce171bf0d
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      MAX_THREADS: 3
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  drupal-static:
    volumes:
      - ./tmp/drupal-private-files/canonical/${DOMAIN}/0:/usr/share/nginx/drupal:ro
      - ./tmp/drupal-private-files/iiif/${DOMAIN}/294de3557d9d00b3d2d8a1e6aab028cf:/usr/share/nginx/iiif:ro
      - drupal-public-files:/var/www/drupal/web/sites/default/files:ro
      - ./tmp/drupal-static:/tmp:rw
      - ./tmp/nginx-static:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-static-cache:/var/cache/nginx:rw
      - ./tmp/drupal/web:/var/www/drupal/web:rw
  fcrepo:
    volumes:
      - fcrepo-data:/data:rw
      - ./tmp/fcrepo:/tmp:rw
  triplet:
    volumes:
      - drupal-public-files:/public:r
      - ./tmp/drupal-private-files:/private:r
      - fcrepo-data:/fcrepo:r
      - ./certs/rootCA.pem:/etc/ssl/certs/lehigh.pem:r
      - ./conf/triplet/config.yaml:/etc/triplet/config.yaml:r
      - ./tmp/triplet-cache:/var/lib/triplet/cache:rw
