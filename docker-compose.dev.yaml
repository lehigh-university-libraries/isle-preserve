x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  alpaca:
    environment:
      ALPACA_DERIVATIVE_FITS_URL: http://crayfits:8080
      ALPACA_DERIVATIVE_OCR_URL: http://hypercube:8080
      ALPACA_DERIVATIVE_HOMARUS_URL: http://homarus:8080
      ALPACA_DERIVATIVE_HOUDINI_URL: http://houdini:8080
      ALPACA_DERIVATIVE_LIBREOFFICE_URL: http://libreoffice:8080
      ALPACA_DERIVATIVE_WHISPER_URL: http://whisper:8080
      ALPACA_DERIVATIVE_OCRPDF_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_HTR_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_SCRIBE_URL: http://scribe:8080
  drupal-cron:
    profiles: [none]
  rollout:
    profiles: [none]
  drupal-lehigh:
    profiles: [none]
  traefik:
    ports:
      - 8080:8080
  drupal:
    build:
      context: ./drupal
      x-bake:
        cache-from:
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:local
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:main
        cache-to:
          - type=inline
        platforms:
          - linux/arm64
    environment:
      URI_SCHEME: http
      DRUPAL_ENABLE_HTTPS: "false"
    secrets:
      - source: UID
    volumes:
      - drupal-public-files:/var/www/drupal/web/sites/default/files:rw
      - ./tmp/drupal-private-files:/var/www/drupal/private:rw
      - fcrepo-data:/fcrepo:rw
      - ./tmp/drupal:/tmp:rw
      - ./tmp/nginx:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-cache:/var/cache/nginx:rw
      - ./drupal/rootfs/var/www/drupal:/var/www/drupal:z,rw,${CONSISTENCY}
  mariadb:
    ports:
      - 3306:3306
  memcached:
    command: memcached -m 256 -I 5m
  fits:
    logging: *logging
    image: islandora/fits:7.0.32@sha256:5366184924abfc55a5ac06ed2efb797f77de74257703b97e4ce1cdd076159107
    volumes:
      - ./tmp/fits:/tmp:rw
  crayfits:
    logging: *logging
    image: islandora/crayfits:7.0.32@sha256:c20cc5235e602e406db7b86eb6927ed63c423109d6d4af208c889dd36c68c0b8
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/crayfits:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hls:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-hls:main@sha256:da146ec88cc007f5a9058a646797c78757261b325afeb6191e2f5529528fde2e
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  homarus:
    logging: *logging
    image: islandora/homarus:7.0.32@sha256:c7afa242e1f7c90ff05d5300f86c4a5ef934689e2c0194ad0c34f526bef2a360
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/homarus:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  houdini:
    logging: *logging
    image: islandora/houdini:7.0.32@sha256:dcdde8c3fa327848f6a91ea3d8e5be7d7ac85cfa0b37f246994b0922582b7a64
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/houdini:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hypercube:
    logging: *logging
    image: islandora/hypercube:7.0.32@sha256:df2e810ae13d81f7ace65429d91b2577e37b5146e15c58bc55f961fa279c952e
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/hypercube:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  ocrpdf:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-ocrpdf:main@sha256:6b649f4a5add2ab59f6d4cd55a1b951a2e09889af3c8424c011a81c1844f9f93
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
  scribe:
    logging: *logging
    image: lehighlts/scyllaridae-scribe:main@sha256:0fb867d7f925f0a79cbc285bd1bc558b7011460b09f9020c5317b1e4084a4d40
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      SCRIBE_API_URL: ${SCRIBE_API_URL}
      SCRIBE_API_TOKEN: ${SCRIBE_API_TOKEN}
      SCRIBE_WORKSPACE_ID: ${SCRIBE_WORKSPACE_ID}
      ISLANDORA_SCRIBE_CORRELATION_URL: https://${DOMAIN}/islandora-scribe/correlation
      ISLANDORA_SCRIBE_CORRELATION_SECRET: ${ISLANDORA_SCRIBE_CORRELATION_SECRET}
    volumes:
      - ./certs/rootCA.pem:/app/ca.pem:r
  libreoffice:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-libreoffice:main@sha256:b94296ab099519bac2db95a7ec9a8dd9208569ab90b061e62a09756e9ac9a888
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  coverpage:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-coverpage:main@sha256:ec8d5c3005f026a975920409b3afdbf30d8e04ebedaa7446a80d087a62ac753e
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  mergepdf:
    logging: *logging
    image: islandora/mergepdf:7.0.32@sha256:1871243d2e71c381b1f8905623e9469b07723dcd913ad518f4620d27b05819e5
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      MAX_THREADS: 3
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  drupal-static:
    volumes:
      - ./tmp/drupal-private-files/canonical/${DOMAIN}/0:/usr/share/nginx/drupal:ro
      - ./tmp/drupal-private-files/iiif/${DOMAIN}/294de3557d9d00b3d2d8a1e6aab028cf:/usr/share/nginx/iiif:ro
      - drupal-public-files:/var/www/drupal/web/sites/default/files:ro
      - ./tmp/drupal-static:/tmp:rw
      - ./tmp/nginx-static:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-static-cache:/var/cache/nginx:rw
      - ./tmp/drupal/web:/var/www/drupal/web:rw
  fcrepo:
    volumes:
      - fcrepo-data:/data:rw
      - ./tmp/fcrepo:/tmp:rw
  triplet:
    volumes:
      - drupal-public-files:/public:r
      - ./tmp/drupal-private-files:/private:r
      - fcrepo-data:/fcrepo:r
      - ./certs/rootCA.pem:/etc/ssl/certs/lehigh.pem:r
      - ./conf/triplet/config.yaml:/etc/triplet/config.yaml:r
      - ./tmp/triplet-cache:/var/lib/triplet/cache:rw
