x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  alpaca:
    environment:
      ALPACA_DERIVATIVE_FITS_URL: http://crayfits:8080
      ALPACA_DERIVATIVE_OCR_URL: http://hypercube:8080
      ALPACA_DERIVATIVE_HOMARUS_URL: http://homarus:8080
      ALPACA_DERIVATIVE_HOUDINI_URL: http://houdini:8080
      ALPACA_DERIVATIVE_LIBREOFFICE_URL: http://libreoffice:8080
      ALPACA_DERIVATIVE_WHISPER_URL: http://whisper:8080
      ALPACA_DERIVATIVE_OCRPDF_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_HTR_URL: http://ocrpdf:8080
      ALPACA_DERIVATIVE_SCRIBE_URL: http://scribe:8080
  drupal-cron:
    profiles: [none]
  rollout:
    profiles: [none]
  drupal-lehigh:
    profiles: [none]
  traefik:
    ports:
      - 8080:8080
  drupal:
    build:
      context: ./drupal
      x-bake:
        cache-from:
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:local
          - type=registry,ref=ghcr.io/lehigh-university-libraries/${COMPOSE_PROJECT_NAME}:main
        cache-to:
          - type=inline
        platforms:
          - linux/arm64
    environment:
      URI_SCHEME: http
      DRUPAL_ENABLE_HTTPS: "false"
    secrets:
      - source: UID
    volumes:
      - drupal-public-files:/var/www/drupal/web/sites/default/files:rw
      - ./tmp/drupal-private-files:/var/www/drupal/private:rw
      - fcrepo-data:/fcrepo:rw
      - ./tmp/drupal:/tmp:rw
      - ./tmp/nginx:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-cache:/var/cache/nginx:rw
      - ./drupal/rootfs/var/www/drupal:/var/www/drupal:z,rw,${CONSISTENCY}
  mariadb:
    ports:
      - 3306:3306
  memcached:
    command: memcached -m 256 -I 5m
  fits:
    logging: *logging
    image: islandora/fits:7.0.23@sha256:575655066e8289b12af385d3461b0c599997e50de9c09e33d9c224744a5f31fd
    volumes:
      - ./tmp/fits:/tmp:rw
  crayfits:
    logging: *logging
    image: islandora/crayfits:7.0.23@sha256:bba65751b053cab264f1ac629ec86d1bc808d33acf9cbcac95e26b82dca33dc3
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/crayfits:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hls:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-hls:main@sha256:7c88d0910178a4b4cd7db6c5dcc172f0324db141249ad03e46db007044e330ab
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  homarus:
    logging: *logging
    image: islandora/homarus:7.0.23@sha256:01765a6c9666865cb59a89eef370196f8f26f45e13a5473f731029ec1ea7c482
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/homarus:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  houdini:
    logging: *logging
    image: islandora/houdini:7.0.23@sha256:71970259968c825300bf975271334d0491b81850142f13f3baaccbc308ed8daf
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/houdini:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  hypercube:
    logging: *logging
    image: islandora/hypercube:7.0.23@sha256:e4aa0476eb0b76b971bfc988a115fdfcddbe1dc806259b64a0f7e69c93866383
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    volumes:
      - ./tmp/hypercube:/tmp:rw
      - ./certs/rootCA.pem:/app/ca.pem:r
  ocrpdf:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-ocrpdf:main@sha256:ff568fb2a225346ebb6ea77c9710aeb08cc29f4f8906ecec849347d9670097b8
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
  scribe:
    logging: *logging
    image: lehighlts/scyllaridae-scribe:main@sha256:0fb867d7f925f0a79cbc285bd1bc558b7011460b09f9020c5317b1e4084a4d40
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      SCRIBE_API_URL: ${SCRIBE_API_URL}
      SCRIBE_API_TOKEN: ${SCRIBE_API_TOKEN}
      SCRIBE_WORKSPACE_ID: ${SCRIBE_WORKSPACE_ID}
      ISLANDORA_SCRIBE_CORRELATION_URL: https://${DOMAIN}/islandora-scribe/correlation
      ISLANDORA_SCRIBE_CORRELATION_SECRET: ${ISLANDORA_SCRIBE_CORRELATION_SECRET}
    volumes:
      - ./certs/rootCA.pem:/app/ca.pem:r
  libreoffice:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-libreoffice:main@sha256:bdd71c6e0f5e05ef20d5a1fa56af8984be1f77c6f150da040395bf80d30a9214
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  coverpage:
    logging: *logging
    image: ghcr.io/lehigh-university-libraries/scyllaridae-coverpage:main@sha256:24cfde5073f3b6fecb2b392868285c404c4414cce806d77b339ba8b4241b4ca4
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  mergepdf:
    logging: *logging
    image: islandora/mergepdf:7.0.23@sha256:98cc20ddef4c26fadc20957211da04fcec395082d83727152b6677d5b6f5cae7
    environment:
      JWKS_URI: https://${DOMAIN}/oauth/discovery/keys
      MAX_THREADS: 3
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_PUBLIC_KEY
  drupal-static:
    volumes:
      - ./tmp/drupal-private-files/canonical/${DOMAIN}/0:/usr/share/nginx/drupal:ro
      - ./tmp/drupal-private-files/iiif/${DOMAIN}/294de3557d9d00b3d2d8a1e6aab028cf:/usr/share/nginx/iiif:ro
      - drupal-public-files:/var/www/drupal/web/sites/default/files:ro
      - ./tmp/drupal-static:/tmp:rw
      - ./tmp/nginx-static:/var/lib/nginx/tmp:rw
      - ./tmp/nginx-static-cache:/var/cache/nginx:rw
      - ./tmp/drupal/web:/var/www/drupal/web:rw
  fcrepo:
    volumes:
      - fcrepo-data:/data:rw
      - ./tmp/fcrepo:/tmp:rw
  triplet:
    volumes:
      - drupal-public-files:/public:r
      - ./tmp/drupal-private-files:/private:r
      - fcrepo-data:/fcrepo:r
      - ./certs/rootCA.pem:/etc/ssl/certs/lehigh.pem:r
      - ./conf/triplet/config.yaml:/etc/triplet/config.yaml:r
      - ./tmp/triplet-cache:/var/lib/triplet/cache:rw
