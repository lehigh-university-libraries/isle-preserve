apiVersion: v1
kind: Service
metadata:
  name: islandora-scribe-book
spec:
  selector:
    app: islandora-scribe-book
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: islandora-scribe-book
spec:
  replicas: 1
  selector:
    matchLabels:
      app: islandora-scribe-book
  template:
    metadata:
      labels:
        app: islandora-scribe-book
    spec:
      containers:
        - name: scyllaridae-scribe-book
          image: lehighlts/scyllaridae-scribe-book:scribe-book-microservice@sha256:c2cf49b258080b97844ced51980697234f86cb7dbab7ea17d76775096e41b67d
          imagePullPolicy: IfNotPresent
          env:
            - name: SCRIBE_API_URL
              valueFrom:
                secretKeyRef:
                  name: scribe
                  key: api-url
            - name: SCRIBE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scribe
                  key: api-token
            - name: SCRIBE_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: scribe
                  key: workspace-id
            - name: ISLANDORA_SCRIBE_CORRELATION_URL
              value: "https://preserve.lehigh.edu/islandora-scribe/correlation"
            - name: ISLANDORA_SCRIBE_CORRELATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: scribe
                  key: correlation-secret
            - name: JWKS_URI
              value: "https://preserve.lehigh.edu/oauth/discovery/keys"
            - name: CERT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: islandora-prod-ca
                  key: islandora-prod.pem
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
